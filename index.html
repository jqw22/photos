<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photography on Nostr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a contact sheet — slim masthead, then an edge-to-edge grid of square frames that keeps loading as you scroll */
:root {
  --paper: #f3f2ef;
  --ink: #17181a;
  --muted: #6b6d72;
  --frame: #e2e1dd;
  --line: #d3d2cd;
  --accent: #c2410c;
  --scrim: rgba(12, 12, 14, .94);
  --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111214; --ink: #ecebe7; --muted: #8d8f95; --frame: #1d1e21; --line: #2a2b2f; --accent: #f08a4b; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111214; --ink: #ecebe7; --muted: #8d8f95; --frame: #1d1e21; --line: #2a2b2f; --accent: #f08a4b; color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 15px/1.5 var(--display);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
[hidden] { display: none !important; }
img { max-width: 100%; }

header.mast {
  display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px 32px;
  padding-block: 40px 20px; border-bottom: 1px solid var(--line); margin-bottom: 16px;
}
.who { display: flex; align-items: center; gap: 14px; min-width: 0; }
.avatar { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; background: var(--frame); flex: none; }
.who h1 { margin: 0; font-size: clamp(26px, 5vw, 44px); font-weight: 700; letter-spacing: -.02em; line-height: 1.05; text-wrap: balance; }
.who h1 .tag { color: var(--accent); }
.who p { margin: 4px 0 0; font: 12px/1.4 var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.status { font: 12px/1.6 var(--mono); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.status b { color: var(--ink); font-weight: 500; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin-right: 6px; vertical-align: 1px; }
.dot.live { background: #16a34a; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px; }
@media (max-width: 520px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 4px; } }
.cell {
  position: relative; aspect-ratio: 1; max-width: 100%; overflow: hidden; background: var(--frame);
  border: 0; padding: 0; cursor: zoom-in; display: block; width: 100%;
}
.cell img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .4s, transform .5s; }
.cell img.ok { opacity: 1; }
.cell:hover img, .cell:focus-visible img { transform: scale(1.03); }
.cell:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cell .fr {
  position: absolute; left: 6px; bottom: 6px; font: 500 10px/1 var(--mono); letter-spacing: .06em;
  color: #fff; background: rgba(0,0,0,.45); padding: 4px 5px; border-radius: 2px; font-variant-numeric: tabular-nums;
}
.cell .multi { left: auto; right: 6px; }

.foot { padding-top: 28px; text-align: center; font: 12px/1.5 var(--mono); color: var(--muted); }
.foot button {
  font: 500 12px var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--ink);
  background: transparent; border: 1px solid var(--line); padding: 10px 18px; cursor: pointer;
}
.foot button:hover { border-color: var(--ink); }
.empty { padding: 60px 0; text-align: center; color: var(--muted); font: 13px/1.6 var(--mono); grid-column: 1 / -1; }

/* Lightbox */
.lb {
  position: fixed; inset: 0; z-index: 50; background: var(--scrim); color: #ecebe7;
  display: grid; grid-template-rows: 1fr auto;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.lb .stage { display: flex; align-items: center; justify-content: center; min-height: 0; }
.lb .stage img { max-height: 100%; max-width: 100%; object-fit: contain; }
.lb .meta { display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; align-items: start; padding-top: 14px; max-width: 1100px; width: 100%; margin: 0 auto; }
.lb .cap { margin: 0; max-width: 65ch; min-width: 0; font-size: 15px; overflow-wrap: anywhere; white-space: pre-line; }
.lb .info { font: 12px/1.7 var(--mono); color: #a7a8ad; text-align: right; }
.lb .info a { color: #f08a4b; }
.lb .btn {
  position: absolute; background: rgba(255,255,255,.08); color: #fff; border: 0; width: 44px; height: 44px;
  border-radius: 50%; font: 20px/1 var(--mono); cursor: pointer;
}
.lb .btn:hover, .lb .btn:focus-visible { background: rgba(255,255,255,.2); outline: none; }
.lb .close { top: max(16px, env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); }
.lb .prev { left: max(16px, env(safe-area-inset-left, 0px)); top: 45%; }
.lb .next { right: max(16px, env(safe-area-inset-right, 0px)); top: 45%; }
@media (prefers-reduced-motion: reduce) { .cell img { transition: none; } .cell:hover img { transform: none; } }
</style>
</head>
<body>

<header class="mast">
  <div class="who">
    <img class="avatar" id="avatar" alt="" hidden>
    <div>
      <h1 id="name"><span class="tag">#photography</span></h1>
      <p id="npub"></p>
    </div>
  </div>
  <div class="status" id="status"><span class="dot"></span>Connecting to relays…</div>
</header>

<main class="grid" id="grid"></main>

<div class="foot" id="foot">
  <button id="more" type="button" hidden>Load older photos</button>
  <div id="footnote"></div>
</div>
<div id="sentinel" style="height:1px"></div>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
  <div class="stage"><img id="lbImg" alt=""></div>
  <div class="meta">
    <p class="cap" id="lbCap"></p>
    <div class="info" id="lbInfo"></div>
  </div>
  <button class="btn close" id="lbClose" type="button" aria-label="Close">×</button>
  <button class="btn prev" id="lbPrev" type="button" aria-label="Previous photo">‹</button>
  <button class="btn next" id="lbNext" type="button" aria-label="Next photo">›</button>
</div>

<script>
(() => {
  // ---- Settings ----------------------------------------------------------
  const NPUB = "npub1hf9rnm4ssuf4y30zhs3x0k38yj555p6yxaft3zaqcdfnmhumf34sd8z24s";
  const HASHTAG = "photography";
  const RELAYS = [
    "wss://relay.damus.io",
    "wss://nos.lol",
    "wss://relay.primal.net",
    "wss://relay.nostr.band",
    "wss://nostr.wine",
    "wss://relay.snort.social"
  ];
  const PAGE = 100;          // events requested per relay per page
  const PAGE_TIMEOUT = 6000; // ms to wait for relays to finish a page

  // ---- bech32 ------------------------------------------------------------
  const CH = "qpzry9x8gf2tvdw0s3jn54khce6mua7l";
  function polymod(v){const G=[0x3b6a57b2,0x26508e6d,0x1ea119fa,0x3d4233dd,0x2a1462b3];let c=1;for(const x of v){const b=c>>25;c=((c&0x1ffffff)<<5)^x;for(let i=0;i<5;i++)if((b>>i)&1)c^=G[i];}return c;}
  function hrpExp(h){const r=[];for(const ch of h)r.push(ch.charCodeAt(0)>>5);r.push(0);for(const ch of h)r.push(ch.charCodeAt(0)&31);return r;}
  function convert(data,from,to,pad){let acc=0,bits=0;const out=[],max=(1<<to)-1;for(const v of data){acc=(acc<<from)|v;bits+=from;while(bits>=to){bits-=to;out.push((acc>>bits)&max);}}if(pad&&bits)out.push((acc<<(to-bits))&max);return out;}
  function decodeNpub(s){const d=[...s.slice(s.lastIndexOf("1")+1,-6)].map(c=>CH.indexOf(c));return convert(d,5,8,false).map(b=>b.toString(16).padStart(2,"0")).join("");}
  function encode(hrp,hex){const bytes=hex.match(/../g).map(h=>parseInt(h,16));const data=convert(bytes,8,5,true);const pm=polymod([...hrpExp(hrp),...data,0,0,0,0,0,0])^1;const chk=[];for(let i=0;i<6;i++)chk.push((pm>>(5*(5-i)))&31);return hrp+"1"+[...data,...chk].map(x=>CH[x]).join("");}

  const PUBKEY = decodeNpub(NPUB);

  // ---- State -------------------------------------------------------------
  const $ = id => document.getElementById(id);
  const grid = $("grid");
  const seenEvents = new Set();
  const seenUrls = new Set();
  const photos = [];            // {url, event, idx, of}
  let oldest = Math.floor(Date.now()/1000) + 60;
  let loading = false, exhausted = false;
  const sockets = new Map();    // url -> WebSocket (open)
  let subCounter = 0;

  $("npub").textContent = NPUB.slice(0, 16) + "…" + NPUB.slice(-8);

  function setStatus(html, live){ $("status").innerHTML = `<span class="dot${live?" live":""}"></span>` + html; }

  // ---- Relay pool --------------------------------------------------------
  function openRelay(url){
    return new Promise(resolve => {
      let ws; try { ws = new WebSocket(url); } catch { return resolve(null); }
      const t = setTimeout(() => { try{ws.close();}catch{} resolve(null); }, 5000);
      ws.onopen = () => { clearTimeout(t); sockets.set(url, ws); resolve(ws); };
      ws.onerror = () => { clearTimeout(t); resolve(null); };
      ws.onclose = () => sockets.delete(url);
      ws.handlers = new Map();
      ws.onmessage = m => {
        let msg; try { msg = JSON.parse(m.data); } catch { return; }
        const h = ws.handlers.get(msg[1]); if (h) h(msg);
      };
    });
  }

  // Run one subscription across all open relays, resolve when every relay sends EOSE (or timeout).
  function query(filters, onEvent){
    return new Promise(resolve => {
      const id = "p" + (++subCounter);
      const open = [...sockets.values()].filter(ws => ws.readyState === 1);
      if (!open.length) return resolve();
      let pending = open.length;
      const finish = () => { open.forEach(ws => { ws.handlers.delete(id); try { ws.send(JSON.stringify(["CLOSE", id])); } catch {} }); resolve(); };
      const t = setTimeout(finish, PAGE_TIMEOUT);
      open.forEach(ws => {
        ws.handlers.set(id, msg => {
          if (msg[0] === "EVENT") onEvent(msg[2]);
          else if (msg[0] === "EOSE" || msg[0] === "CLOSED") { if (--pending === 0) { clearTimeout(t); finish(); } }
        });
        try { ws.send(JSON.stringify(["REQ", id, ...filters])); } catch { pending--; }
      });
    });
  }

  // ---- Event parsing -----------------------------------------------------
  const IMG_RE = /https?:\/\/[^\s"'<>]+?\.(?:jpe?g|png|gif|webp|avif|heic)(?:\?[^\s"'<>]*)?/gi;
  const TAG_RE = new RegExp("(^|\\s)#" + HASHTAG + "\\b", "i");

  function hasHashtag(ev){
    return ev.tags.some(t => t[0] === "t" && String(t[1]).toLowerCase() === HASHTAG) || TAG_RE.test(ev.content || "");
  }
  function imagesOf(ev){
    const urls = [];
    for (const t of ev.tags) {
      if (t[0] === "imeta") {
        const u = t.find(x => typeof x === "string" && x.startsWith("url "));
        const m = t.find(x => typeof x === "string" && x.startsWith("m "));
        if (u && (!m || m.slice(2).startsWith("image/"))) urls.push(u.slice(4).trim());
      }
    }
    for (const m of (ev.content || "").matchAll(IMG_RE)) urls.push(m[0]);
    return [...new Set(urls)];
  }
  function captionOf(ev){
    return (ev.content || "")
      .replace(/https?:\/\/\S+/g, "")
      .replace(/nostr:\S+/g, "")
      .replace(/\n{3,}/g, "\n\n")
      .trim();
  }

  const batch = [];
  function onEvent(ev){
    if (!ev || ev.pubkey !== PUBKEY || seenEvents.has(ev.id)) return;
    if (ev.created_at < oldest) oldest = ev.created_at;
    seenEvents.add(ev.id);
    if (!hasHashtag(ev)) return;
    const urls = imagesOf(ev).filter(u => !seenUrls.has(u));
    if (!urls.length) return;
    batch.push(ev);
  }

  function flush(){
    batch.sort((a, b) => b.created_at - a.created_at);
    for (const ev of batch.splice(0)) {
      const urls = imagesOf(ev).filter(u => !seenUrls.has(u));
      urls.forEach((url, i) => {
        seenUrls.add(url);
        const p = { url, event: ev, idx: i + 1, of: urls.length, n: photos.length };
        photos.push(p);
        grid.appendChild(cell(p));
      });
    }
    // keep grid strictly newest-first even if relays returned out of order
    const sorted = [...grid.children].filter(c => c.dataset.t).sort((a, b) => b.dataset.t - a.dataset.t || a.dataset.n - b.dataset.n);
    sorted.forEach(c => grid.appendChild(c));
    photos.sort((a, b) => b.event.created_at - a.event.created_at || a.n - b.n);
    [...grid.children].forEach((c, i) => { const f = c.querySelector(".fr"); if (f) f.textContent = String(i + 1).padStart(3, "0"); });
  }

  function cell(p){
    const b = document.createElement("button");
    b.className = "cell"; b.type = "button";
    b.dataset.t = p.event.created_at; b.dataset.n = p.n; b.dataset.url = p.url;
    const img = new Image();
    img.loading = "lazy"; img.decoding = "async"; img.referrerPolicy = "no-referrer";
    img.alt = captionOf(p.event).slice(0, 120) || "Photo";
    img.onload = () => img.classList.add("ok");
    img.onerror = () => { b.remove(); const i = photos.indexOf(p); if (i > -1) photos.splice(i, 1); };
    img.src = p.url;
    b.appendChild(img);
    const fr = document.createElement("span"); fr.className = "fr"; b.appendChild(fr);
    if (p.of > 1) { const m = document.createElement("span"); m.className = "fr multi"; m.textContent = p.idx + "/" + p.of; b.appendChild(m); }
    b.addEventListener("click", () => openLb(photos.findIndex(x => x.url === p.url)));
    return b;
  }

  // ---- Paging ------------------------------------------------------------
  async function loadPage(){
    if (loading || exhausted || !sockets.size) return;
    loading = true; $("more").hidden = true;
    const before = seenEvents.size, until = oldest - 1;
    $("footnote").textContent = "Loading…";
    await query([
      { authors: [PUBKEY], kinds: [1, 20], "#t": [HASHTAG, "Photography", "PHOTOGRAPHY"], until, limit: PAGE },
      { authors: [PUBKEY], kinds: [1, 20], until, limit: PAGE }
    ], onEvent);
    flush();
    if (seenEvents.size === before) exhausted = true;
    loading = false;
    const n = grid.querySelectorAll(".cell").length;
    $("footnote").textContent = exhausted
      ? (n ? `That's everything — ${n} photo${n === 1 ? "" : "s"} back to ${fmtDate(oldest)}.` : "")
      : `Showing posts back to ${fmtDate(oldest)}.`;
    $("more").hidden = exhausted;
    if (!n && exhausted) grid.innerHTML = `<div class="empty">No #${HASHTAG} photos found for this account on the connected relays.</div>`;
    updateCount();
    // If the page still isn't full, keep going.
    if (!exhausted && document.body.scrollHeight < innerHeight * 1.5) loadPage();
  }

  function updateCount(){
    const n = grid.querySelectorAll(".cell").length;
    setStatus(`<b>${n}</b> photo${n === 1 ? "" : "s"} · ${sockets.size}/${RELAYS.length} relays`, sockets.size > 0);
  }

  function fmtDate(ts){ return new Date(ts * 1000).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }); }

  // ---- Profile -----------------------------------------------------------
  function loadProfile(){
    let best = null;
    query([{ authors: [PUBKEY], kinds: [0], limit: 1 }], ev => {
      if (ev.pubkey === PUBKEY && (!best || ev.created_at > best.created_at)) best = ev;
    }).then(() => {
      if (!best) return;
      let p; try { p = JSON.parse(best.content); } catch { return; }
      const name = p.display_name || p.name;
      if (name) { $("name").innerHTML = ""; $("name").append(document.createTextNode(name + " "), Object.assign(document.createElement("span"), { className: "tag", textContent: "#" + HASHTAG })); document.title = name + " · #" + HASHTAG; }
      if (p.picture) { const a = $("avatar"); a.referrerPolicy = "no-referrer"; a.src = p.picture; a.hidden = false; a.onerror = () => a.hidden = true; }
    });
  }

  // ---- Lightbox ----------------------------------------------------------
  let cur = -1;
  function openLb(i){
    if (i < 0 || i >= photos.length) return;
    cur = i; const p = photos[i], ev = p.event;
    $("lbImg").src = p.url;
    $("lbImg").alt = captionOf(ev).slice(0, 200) || "Photo";
    $("lbCap").textContent = captionOf(ev);
    const note = encode("note", ev.id);
    $("lbInfo").innerHTML = `${new Date(ev.created_at * 1000).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" })}`
      + (p.of > 1 ? `<br>Image ${p.idx} of ${p.of}` : "")
      + `<br><a href="https://njump.me/${note}" target="_blank" rel="noopener">View post ↗</a>`;
    $("lb").hidden = false; document.body.style.overflow = "hidden";
    $("lbClose").focus();
    if (i > photos.length - 6) loadPage();
  }
  function closeLb(){ $("lb").hidden = true; document.body.style.overflow = ""; const c = grid.children[cur]; if (c) c.focus(); }
  $("lbClose").onclick = closeLb;
  $("lbPrev").onclick = () => openLb(cur - 1);
  $("lbNext").onclick = () => openLb(cur + 1);
  $("lb").addEventListener("click", e => { if (e.target === $("lb") || e.target.classList.contains("stage")) closeLb(); });
  document.addEventListener("keydown", e => {
    if ($("lb").hidden) return;
    if (e.key === "Escape") closeLb();
    else if (e.key === "ArrowLeft") openLb(cur - 1);
    else if (e.key === "ArrowRight") openLb(cur + 1);
  });
  let tx = null;
  $("lb").addEventListener("touchstart", e => tx = e.touches[0].clientX, { passive: true });
  $("lb").addEventListener("touchend", e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) openLb(cur + (dx < 0 ? 1 : -1)); tx = null; });

  // ---- Infinite scroll ---------------------------------------------------
  $("more").onclick = loadPage;
  new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) loadPage(); }, { rootMargin: "800px" }).observe($("sentinel"));

  // ---- Start -------------------------------------------------------------
  (async () => {
    await Promise.all(RELAYS.map(openRelay));
    if (!sockets.size) {
      setStatus("Couldn't reach any relays", false);
      grid.innerHTML = `<div class="empty">None of the Nostr relays answered. Check your connection and reload the page.</div>`;
      return;
    }
    updateCount();
    loadProfile();
    loadPage();
  })();
})();
</script>
</body>
</html>
